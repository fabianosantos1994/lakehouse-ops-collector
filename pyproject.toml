[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-ops-collector"
version = "0.1.0"
description = "Coleta somente leitura do pacote de incidentes da plataforma lakehouse"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
