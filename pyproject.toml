[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-ops-collector"
version = "0.1.0"
description = "Detecção e coleta somente leitura de incidentes da plataforma lakehouse"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lakehouse_ops_collector.detection" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
